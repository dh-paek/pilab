lectures:
  - term: "2026-2"
    code: "DMSE361"
    title: { ko: "프롬프트 엔지니어링", en: "Prompt Engineering" }
    level: undergrad
    english: true
    credits: 3
    category: { ko: "전공선택", en: "Major Elective" }
    schedule: { ko: "월 7–8교시 · 수 9교시 · 가속기ICT융합관 324호", en: "Mon (periods 7–8) · Wed (period 9) · Accelerator ICT Convergence Bldg. 324" }
    desc:
      ko: "대규모 언어 모델(LLM)을 활용하는 설계 역량을 프롬프트 엔지니어링에서 컨텍스트 엔지니어링, 하네스 엔지니어링까지 단계적으로 다룹니다. 모빌리티 데이터 해석과 AI 학습·검증 실습을 통해 AI 에이전트 시대의 모빌리티 시스템을 설계하고 운영하는 역량을 기릅니다."
      en: "Builds layered design skills for working with large language models (LLMs), progressing from prompt engineering to context engineering and harness engineering. Through hands-on practice in mobility data interpretation and AI training and validation, students learn to design and operate mobility systems in the era of AI agents."
    topics: ["LLM", "Prompt Engineering", "Context Engineering", "AI Agents"]
    links: { syllabus: "", materials: "" }

  - term: "2026-2"
    code: "DMSE462"
    title: { ko: "최적상태추정", en: "Optimal State Estimation" }
    level: undergrad
    credits: 3
    category: { ko: "전공선택", en: "Major Elective" }
    schedule: { ko: "수 8교시 · 목 6–7교시 · 가속기ICT융합관 324호", en: "Wed (period 8) · Thu (periods 6–7) · Accelerator ICT Convergence Bldg. 324" }
    desc:
      ko: "최적 상태추정 기술인 칼만 필터의 수학적 원리를 체계적으로 학습하고, 확장 칼만 필터(EKF), 무향 칼만 필터(UKF), 파티클 필터 등 다양한 변형 필터를 다룹니다. 다중 모델 필터와 다중 객체 추적(MOT) 등 자율주행·모빌리티 분야의 응용 사례를 통해 인지-판단-제어 파이프라인의 핵심인 상태추정 역량을 기릅니다."
      en: "Covers the mathematical foundations of the Kalman filter for optimal state estimation and its variants, including the extended Kalman filter (EKF), unscented Kalman filter (UKF), and particle filter. Applications in autonomous driving and mobility, such as multiple-model filters and multi-object tracking (MOT), build core state estimation skills for the perception–decision–control pipeline."
    topics: ["Bayesian Estimation", "Kalman Filter", "EKF · UKF", "Particle Filter", "MOT"]
    links: { syllabus: "", materials: "" }

