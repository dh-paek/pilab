# =====================================================================
#  연구 분야 — Home(요약)과 Research(상세) 페이지에 함께 쓰입니다.
#  tag: publications.yml의 tags와 연결되어 '주요 논문'이 자동으로 표시됩니다.
#  icon: radar | fusion | cube | track | chip | wave  (_includes/icon.html 참고)
#  순서 = Research 페이지의 01~06 파이프라인 순서 (신호·데이터 → … → 임베디드 탑재)
#  figure: Research 페이지 각 분야 제목 바로 아래에 보일 대표 그림 (GIF·PNG·JPG, 또는 MP4·WebM 영상)
#          assets/img/research/ 에 넣고 경로를 적습니다. 예) figure: /assets/img/research/radar.gif
#          16:9 비율 권장 — 다른 비율은 잘리지 않고 여백이 생깁니다. 비워 두면 '그림 준비 중' 자리표시가 보입니다.
#  figure_alt: 그림 설명(대체 텍스트, 선택)
#  figure_labels: (선택) 그림 위에 붙는 패널 이름. 그림이 여러 패널로 나뉠 때 사용
#          w = 원본 그림에서 그 패널의 가로 폭(px 또는 비율), tone = cam(빨강)·lidar(초록)·radar(파랑)
#          text에는 <br>이나 <b class="fl--cam">C</b> 같은 짧은 HTML을 쓸 수 있습니다.
# =====================================================================

- id: data
  tag: data
  icon: wave
  short: { ko: "신호·데이터", en: "Signal & Data" }   # Research 페이지 파이프라인 라벨
  title:
    ko: "레이더 데이터셋·신호 수준 AI"
    en: "Radar Datasets & Signal-Level AI"
  summary:
    ko: "대규모 레이더 데이터셋 구축과 데이터 합성·전처리, 드론·국방 응용을 연구합니다."
    en: "Large-scale radar datasets, data synthesis, cognitive preprocessing, and drone/defense applications."
  description:
    ko: "전 세계 70여 개 기관이 사용하는 K-Radar 데이터셋을 시작으로, LiDAR로부터 레이더 텐서를 합성하는 데이터 확장, 장면·과제 인지형 레이더 전처리(cognitive radar), 드론 레이더와 국방·치안 응용으로 연구를 확장합니다."
    en: "Starting from K-Radar — used by 70+ institutions worldwide — we expand into LiDAR-to-radar tensor synthesis, scene- and task-aware cognitive radar preprocessing, and drone and defense radar applications."
  keywords: ["K-Radar", "Data Synthesis", "Auto-Labeling", "Cognitive Radar", "Drone Radar"]
  figure: "/assets/img/research/data-kradar.png"
  figure_alt: "K-Radar dataset: 4D radar tensor, camera image and LiDAR point cloud in normal, overcast, fog, rain, sleet and heavy snow conditions"

- id: radar
  tag: radar
  icon: radar
  short: { ko: "레이더 인지", en: "Radar Perception" }   # Research 페이지 파이프라인 라벨
  title:
    ko: "4D 레이더 인지"
    en: "4D Radar Perception"
  summary:
    ko: "악천후·야간에도 동작하는 4D 레이더로 3D 객체를 검출하고 장면을 이해합니다."
    en: "3D object detection and scene understanding with 4D radar that works in rain, snow, and darkness."
  description:
    ko: "포인트 클라우드를 넘어 4D 레이더 텐서와 raw ADC 신호를 직접 입력으로 사용하는 딥러닝 구조를 연구합니다. 레이더 고유의 희소성·잡음·도플러 정보를 활용해 날씨와 조명에 강인한 3D 객체 검출 성능을 끌어올립니다."
    en: "We design deep networks that consume 4D radar tensors and raw ADC signals directly, going beyond sparse point clouds. By exploiting radar-specific sparsity, noise, and Doppler cues, we push weather- and illumination-robust 3D object detection."
  keywords: ["4D Radar Tensor", "Raw ADC", "3D Object Detection", "Doppler", "RTNH"]
  figure: "/assets/img/research/radar-sidelobe.mp4"
  figure_alt: "Sidelobe filtering: from 4D radar tensor to filtered 4D radar point cloud"

- id: fusion
  tag: fusion
  icon: fusion
  short: { ko: "센서 융합", en: "Sensor Fusion" }   # Research 페이지 파이프라인 라벨
  title:
    ko: "다중 센서 융합"
    en: "Multi-Modal Sensor Fusion"
  summary:
    ko: "카메라·LiDAR·4D 레이더를 융합하고, 센서 고장·열화에도 견디는 인지 구조를 설계합니다."
    en: "Camera–LiDAR–4D radar fusion that stays reliable even when a sensor degrades or fails."
  description:
    ko: "센서별 가용성(availability)을 고려한 융합 기법으로, 일부 센서가 가려지거나 고장 나도 성능이 급격히 무너지지 않는 인지 시스템을 만듭니다. 통합 표현 공간(canonical space), 스테레오 레이더, 비전-언어 모델과의 정렬까지 융합의 범위를 넓히고 있습니다."
    en: "Availability-aware fusion keeps perception stable when sensors are occluded, degraded, or missing. We explore unified canonical feature spaces, stereo radar, and alignment of radar with vision–language models."
  keywords: ["Availability-aware Fusion", "Camera–LiDAR–Radar", "Canonical Space", "Robustness", "VLM Alignment"]
  figure: "/assets/img/research/fusion-fog.mp4"
  figure_alt: "Camera, LiDAR and 4D radar views of the same object in dense fog, with the sensor used for each region"
  figure_labels:
    - { w: 462, tone: cam,   text: "Camera" }
    - { w: 172, tone: lidar, text: "LiDAR" }
    - { w: 171, tone: radar, text: "4D Radar" }
    - { w: 163, text: 'Sensor-used<br><b class="fl--cam">C</b> + <b class="fl--lidar">L</b> + <b class="fl--radar">R</b>' }

- id: occupancy
  tag: occupancy
  icon: cube
  short: { ko: "장면 이해", en: "Scene Understanding" }   # Research 페이지 파이프라인 라벨
  title:
    ko: "3D 점유 예측·장면 이해"
    en: "3D Occupancy & Scene Understanding"
  summary:
    ko: "레이더 기반 3D semantic occupancy와 깊이 보완으로 주변 공간을 촘촘하게 복원합니다."
    en: "Dense 3D semantic occupancy and depth completion from radar-centric sensing."
  description:
    ko: "객체 단위 검출을 넘어 주행 공간 전체를 복셀 단위로 이해하는 3D semantic occupancy, 주행 가능 영역 검출, 레이더 기반 깊이 보완을 연구합니다. 레이더 데이터에 맞는 새로운 벤치마크와 라벨도 함께 구축합니다."
    en: "Beyond object boxes, we model the whole drivable scene at voxel level — 3D semantic occupancy, drivable-area detection, and radar-guided depth completion — together with new radar benchmarks and labels."
  keywords: ["Semantic Occupancy", "Depth Completion", "Drivable Area", "Benchmark"]
  figure: "/assets/img/research/occupancy-snow.mp4"
  figure_alt: "3D semantic occupancy prediction in heavy snow on a highway: camera, LiDAR, sparse 4D radar point cloud and dense 4D radar tensor (RadarProjGSOcc)"
  figure_labels:
    - { w: 200, tone: cam,   text: "Camera" }
    - { w: 200, tone: lidar, text: "LiDAR" }
    - { w: 200, tone: radar, text: "4D Radar<br>(Sparse)" }
    - { w: 200, tone: radar, text: "4D Radar<br>(Dense)" }

- id: tracking
  tag: tracking
  icon: track
  short: { ko: "추적·예측", en: "Tracking & Prediction" }   # Research 페이지 파이프라인 라벨
  title:
    ko: "다중 객체 추적·상태 추정"
    en: "Multi-Object Tracking & State Estimation"
  summary:
    ko: "칼만 필터·베이지안 추정과 딥러닝을 결합해 객체를 추적하고 궤적을 예측합니다."
    en: "Kalman/Bayesian estimation meets deep learning for tracking and trajectory prediction."
  description:
    ko: "IMM, 칼만 필터 등 고전적 상태 추정 이론과 신경망을 결합해, 레이더의 속도 정보를 살린 다중 객체 추적과 불확실성을 고려한 궤적 예측을 연구합니다."
    en: "We fuse classical state estimation (Kalman filters, IMM) with neural networks for radar-aware multi-object tracking and uncertainty-aware trajectory prediction."
  keywords: ["Kalman Filter", "IMM", "Bayesian Estimation", "Trajectory Prediction", "MOT"]
  figure: "/assets/img/research/tracking-mot.png"
  figure_alt: "4D radar multi-object tracking pipeline: detection and motion prediction with MC dropout, two-stage association and life cycle management"

- id: embedded
  tag: embedded
  icon: chip
  short: { ko: "임베디드 탑재", en: "Embedded Deployment" }   # Research 페이지 파이프라인 라벨
  title:
    ko: "경량·뉴로모픽 임베디드 AI"
    en: "Efficient & Neuromorphic Embedded AI"
  summary:
    ko: "스파이킹 신경망(SNN)과 온디바이스 최적화로 저전력 실시간 인지를 구현합니다."
    en: "Spiking neural networks and on-device optimization for low-power, real-time perception."
  description:
    ko: "스파이킹 신경망(SNN) 기반 레이더 검출·센서 융합, NPU·Jetson 등 엣지 하드웨어 위 실시간 구현을 통해 차량·로봇·드론에 탑재 가능한 저전력 인지 시스템을 만듭니다."
    en: "From SNN-based radar detection and fusion to real-time deployment on NPUs and Jetson-class edge hardware, we build low-power perception that fits on vehicles, robots, and drones."
  keywords: ["Spiking Neural Network", "On-Chip AI", "NPU", "Real-Time", "Edge Deployment"]
  figure: "/assets/img/research/embedded-spikingfusion.png"
  figure_alt: "Spiking neural network fusion of 4D radar, LiDAR and camera: sensor-specific spiking encoders, activated feature time inference and SpikingCASAP fusion head"
